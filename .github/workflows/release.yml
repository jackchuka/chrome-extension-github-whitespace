name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 8.14.1
          run_install: false

      - name: Install Node.js
        run: pnpm env use --global 24
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run fmt -- --check .

      - name: Run tests
        run: pnpm test

      - name: Build
        run: |
          pnpm run clean
          pnpm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs=require('node:fs');const p='dist/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));m.version=process.env.VERSION;fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');"

      - name: Package zip
        env:
          ZIP_NAME: github-extension-whitespace-${{ steps.version.outputs.version }}.zip
        run: |
          (cd dist && zip -r "../$ZIP_NAME" . -x "*.DS_Store" -x "__MACOSX/*" -x "*/__MACOSX/*")

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: github-extension-whitespace-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
