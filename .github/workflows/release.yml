name: Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 8.14.1
          run_install: false

      - name: Install Node.js
        run: pnpm env use --global 24
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run fmt -- --check .

      - name: Run tests
        run: pnpm test

      - name: Build
        run: |
          pnpm run clean
          pnpm run build

      - name: Check if version changed
        id: version-check
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -n "$LAST_TAG" ]; then
            PUBLISHED_VERSION="${LAST_TAG#v}"
          else
            PUBLISHED_VERSION="0.0.0"
          fi
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed from $PUBLISHED_VERSION to $CURRENT_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged: $CURRENT_VERSION"
          fi

      - name: Set manifest version
        if: steps.version-check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version-check.outputs.current }}
        run: |
          node -e "const fs=require('node:fs');const p='dist/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));m.version=process.env.VERSION;fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');"

      - name: Package zip
        if: steps.version-check.outputs.changed == 'true'
        env:
          ZIP_NAME: github-extension-whitespace-${{ steps.version-check.outputs.current }}.zip
        run: |
          (cd dist && zip -r "../$ZIP_NAME" . -x "*.DS_Store" -x "__MACOSX/*" -x "*/__MACOSX/*")

      - name: Create GitHub release
        if: steps.version-check.outputs.changed == 'true'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ steps.version-check.outputs.current }}
          name: Release v${{ steps.version-check.outputs.current }}
          files: github-extension-whitespace-${{ steps.version-check.outputs.current }}.zip
          body: |
            Release v${{ steps.version-check.outputs.current }}
          draft: false
          prerelease: false
